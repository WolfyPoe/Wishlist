<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Trevor &amp; Maya's Wishlists</title>
<meta name="description" content="Birthday and Christmas wishlists for Trevor and Maya.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500;700&family=Cinzel:wght@600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body data-theme="trevor">

<header class="hero">
  <!-- Trevor: grid, contour lines, circuits, crosshair, pines -->
  <div class="decor decor-trevor" aria-hidden="true">
    <svg class="full" viewBox="0 0 1440 520" preserveAspectRatio="none">
      <defs><pattern id="tgrid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#62C987" stroke-width="0.6" opacity="0.06"/></pattern></defs>
      <rect width="1440" height="520" fill="url(#tgrid)"/>
      <g fill="none" stroke="#62C987" stroke-width="1" opacity="0.08">
        <path d="M-20 120 C 200 60, 380 180, 620 110 S 1040 40, 1460 130"/>
        <path d="M-20 160 C 210 100, 390 220, 630 150 S 1050 80, 1460 170"/>
        <path d="M-20 200 C 220 140, 400 260, 640 190 S 1060 120, 1460 210"/>
        <path d="M-20 240 C 230 180, 410 300, 650 230 S 1070 160, 1460 250"/>
      </g>
      <g fill="none" stroke="#62C987" stroke-width="1.4" opacity="0.28">
        <polyline points="1440,70 1300,70 1270,100 1180,100"/>
        <polyline points="1440,130 1340,130 1310,160 1240,160 1220,180"/>
        <polyline points="1440,190 1380,190 1360,210 1290,210"/>
      </g>
      <g fill="#62C987" opacity="0.5"><circle cx="1180" cy="100" r="4"/><circle cx="1220" cy="180" r="4"/><circle cx="1290" cy="210" r="4"/></g>
      <g fill="none" stroke="#62C987" stroke-width="1.5" opacity="0.38">
        <circle cx="1120" cy="250" r="54"/><circle cx="1120" cy="250" r="22"/>
        <path d="M1120 180V216M1120 284V320M1050 250H1086M1154 250H1190"/>
      </g>
      <circle cx="1120" cy="250" r="3" fill="#62C987" opacity="0.7"/>
    </svg>
    <svg class="trees" viewBox="0 0 1440 150" preserveAspectRatio="xMidYMax slice">
      <g fill="#141A16">
        <polygon points="40,20 0,150 80,150"/><polygon points="110,50 75,150 145,150"/><polygon points="180,10 135,150 225,150"/>
        <polygon points="260,60 230,150 290,150"/><polygon points="330,30 290,150 370,150"/><polygon points="560,70 535,150 585,150"/>
        <polygon points="880,60 850,150 910,150"/><polygon points="1060,40 1025,150 1095,150"/><polygon points="1140,15 1095,150 1185,150"/>
        <polygon points="1220,55 1190,150 1250,150"/><polygon points="1300,25 1260,150 1340,150"/><polygon points="1390,45 1355,150 1425,150"/>
      </g>
      <g fill="#101411">
        <polygon points="70,70 45,150 95,150"/><polygon points="220,80 195,150 245,150"/><polygon points="420,90 400,150 440,150"/>
        <polygon points="720,95 700,150 740,150"/><polygon points="980,85 958,150 1002,150"/><polygon points="1180,75 1155,150 1205,150"/><polygon points="1350,85 1328,150 1372,150"/>
      </g>
    </svg>
  </div>

  <!-- Maya: stars, constellation, crescent moon, gems -->
  <div class="decor decor-maya" aria-hidden="true">
    <svg class="full" viewBox="0 0 1440 520" preserveAspectRatio="xMidYMid slice">
      <g fill="#E9D8FF">
        <circle cx="90" cy="70" r="1.6" opacity="0.7"/><circle cx="230" cy="190" r="1.1" opacity="0.5"/><circle cx="400" cy="60" r="1.8" opacity="0.5"/>
        <circle cx="560" cy="160" r="1.2" opacity="0.6"/><circle cx="700" cy="40" r="1.5" opacity="0.6"/><circle cx="820" cy="420" r="1.2" opacity="0.5"/>
        <circle cx="960" cy="90" r="1.4" opacity="0.6"/><circle cx="1390" cy="380" r="1.6" opacity="0.6"/><circle cx="660" cy="460" r="1" opacity="0.5"/>
      </g>
      <polyline points="980,60 1040,110 1010,180 1090,220 1160,190" fill="none" stroke="#B48AF5" stroke-width="1" opacity="0.45"/>
      <g fill="#D9C2FF"><circle cx="980" cy="60" r="2.5"/><circle cx="1040" cy="110" r="2.5"/><circle cx="1010" cy="180" r="2.5"/><circle cx="1090" cy="220" r="2.5"/><circle cx="1160" cy="190" r="2.5"/></g>
      <circle cx="1290" cy="110" r="90" fill="#B48AF5" opacity="0.08"/>
      <path d="M1300 40 A70 70 0 1 0 1300 180 A100 100 0 0 1 1300 40 Z" fill="#E9D8FF" opacity="0.85"/>
      <g fill="none" stroke="#C9A6FF" stroke-width="1.5" opacity="0.6" transform="translate(1180 300)">
        <polygon points="30,0 90,0 120,32 60,104 0,32"/><path d="M0 32H120M30 0L45 32L60 104L75 32L90 0M45 32L60 0L75 32"/>
      </g>
      <g fill="none" stroke="#C9A6FF" stroke-width="1.2" opacity="0.35" transform="translate(1340 260) scale(0.55)">
        <polygon points="30,0 90,0 120,32 60,104 0,32"/><path d="M0 32H120M30 0L45 32L60 104L75 32L90 0M45 32L60 0L75 32"/>
      </g>
      <g fill="#E9D8FF" opacity="0.7">
        <path d="M1120 330 l4 10 l10 4 l-10 4 l-4 10 l-4 -10 l-10 -4 l10 -4 z"/>
        <path d="M300 380 l3 8 l8 3 l-8 3 l-3 8 l-3 -8 l-8 -3 l8 -3 z"/>
      </g>
    </svg>
  </div>

  <div class="hero-inner">
    <div class="hero-main">
      <div class="switch" role="group" aria-label="Whose list" id="people"></div>
      <p class="eyebrow" id="eyebrow"></p>
      <div class="title-row">
        <div class="avatar" id="avatar"></div>
        <h1><span id="person-name">Trevor</span>'s<br>Wishlist</h1>
      </div>
      <p class="lead">Stuck on what to get me? Here's the list. Tap “I'm getting this” so nobody doubles up.</p>
    </div>
    <div class="stats">
      <div class="stat">
        <span class="stat-label" id="bday-title">Birthday</span>
        <span class="stat-num" id="bday-days">—</span>
        <span class="stat-sub" id="bday-label"></span>
      </div>
      <div class="stat">
        <span class="stat-label b" id="xmas-title">Christmas</span>
        <span class="stat-num" id="xmas-days">—</span>
        <span class="stat-sub" id="xmas-label"></span>
      </div>
    </div>
  </div>
</header>

<main>
  <div class="toolbar">
    <div class="filters" role="group" aria-label="Filter by occasion" id="filters">
      <button type="button" data-filter="all" aria-pressed="true">Everything</button>
      <button type="button" data-filter="birthday" aria-pressed="false">Birthday</button>
      <button type="button" data-filter="christmas" aria-pressed="false">Christmas</button>
    </div>
    <p class="summary" id="summary" aria-live="polite"></p>
  </div>

  <div class="grid" id="grid"></div>
  <p class="empty" id="empty" hidden>Nothing here for this one yet.</p>

  <footer>
    <span id="gift-line"></span>
    <span id="sizes-line"></span>
    <button type="button" class="footer-edit" id="edit-open">Edit my list</button>
  </footer>
</main>

<!-- Bottom bar while signed in -->
<div class="edit-bar" id="edit-bar" hidden>
  <span class="edit-who" id="edit-who"></span>
  <button type="button" class="btn-primary" id="add-item">+ Add item</button>
  <button type="button" class="btn-ghost" id="sign-out">Sign out</button>
</div>

<!-- Sign-in -->
<dialog id="login-dialog" aria-labelledby="login-title">
  <form id="login-form" method="dialog">
    <h2 id="login-title">Edit your list</h2>
    <p class="dialog-sub" id="login-sub">Enter your email and we'll send you a sign-in link.</p>
    <label class="field"><span>Email</span>
      <input type="email" id="login-email" autocomplete="email" required>
    </label>
    <p class="form-msg" id="login-msg" aria-live="polite"></p>
    <div class="dialog-actions">
      <button type="button" class="btn-ghost" data-close>Cancel</button>
      <button type="submit" class="btn-primary" id="login-send">Send link</button>
    </div>
  </form>
</dialog>

<!-- Add / edit item -->
<dialog id="item-dialog" aria-labelledby="item-title">
  <form id="item-form" method="dialog">
    <h2 id="item-title">Add item</h2>
    <label class="field"><span>What is it? *</span>
      <input type="text" id="f-name" required maxlength="120">
    </label>
    <label class="field"><span>Link</span>
      <input type="url" id="f-link" placeholder="Paste from Amazon or any store" inputmode="url">
    </label>
    <div class="field-row">
      <label class="field"><span>Price</span>
        <input type="text" id="f-price" placeholder="$25" maxlength="20">
      </label>
      <label class="field field-qty"><span>How many</span>
        <input type="number" id="f-qty" min="1" max="99" step="1" value="1" inputmode="numeric">
      </label>
    </div>
    <label class="field"><span>Category</span>
      <input type="text" id="f-category" list="category-list" maxlength="40">
    </label>
    <datalist id="category-list"></datalist>
    <label class="field"><span>Notes (size, color, model…)</span>
      <textarea id="f-note" rows="3" maxlength="300"></textarea>
    </label>
    <label class="field"><span>For</span>
      <select id="f-occ">
        <option value="either">Either one</option>
        <option value="birthday">Birthday</option>
        <option value="christmas">Christmas</option>
      </select>
    </label>
    <label class="check"><input type="checkbox" id="f-top"> <span>Most wanted</span></label>
    <p class="form-msg" id="item-msg" aria-live="polite"></p>
    <div class="dialog-actions">
      <button type="button" class="btn-ghost" data-close>Cancel</button>
      <button type="submit" class="btn-primary" id="item-save">Save</button>
    </div>
  </form>
</dialog>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="data.js"></script>
<script src="app.js"></script>
</body>
</html>
